name: CI/CD NAYOMI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/frederickmeyapiiii/facturation-pme
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_DATABASE_NAME: testdb
      DJANGO_DATABASE_USER: testuser
      DJANGO_DATABASE_PASSWORD: testpass
      DJANGO_DATABASE_HOST: localhost
      DJANGO_DATABASE_PORT: 5432
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DJANGO_DEBUG: True

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies for pycairo
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libffi-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r src/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django checks
        run: python src/manage.py check --deploy

      - name: Run Django tests with coverage
        run: |
          cd src
          coverage run --source='.' manage.py test || true
          coverage report || true
          coverage xml || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./src/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  security:
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/facturation-pme-key.pem
          chmod 600 ~/.ssh/facturation-pme-key.pem
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      - name: Ensure Docker is installed on EC2
        run: |
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} <<'EOF'
            mkdir -p /home/ubuntu/facturation-pme
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi
          EOF

      - name: Copy docker files to EC2
        run: |
          scp -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no -r docker ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }}:/home/ubuntu/facturation-pme/

      - name: Configure .env on EC2
        run: |
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} <<'EOF'
            mkdir -p /home/ubuntu/facturation-pme/docker
            cat > /home/ubuntu/facturation-pme/docker/.env <<'ENV'
            DJANGO_DEBUG=False
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,${{ secrets.EC2_IP }}
            DJANGO_DATABASE_ENGINE=django.db.backends.postgresql
            DJANGO_DATABASE_NAME=facturationpme
            DJANGO_DATABASE_USER=facturationpme
            DJANGO_DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}
            DJANGO_DATABASE_HOST=db
            DJANGO_DATABASE_PORT=5432
            ENV
          EOF

      - name: Pull Docker image
        run: |
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} "echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} "sudo docker pull ghcr.io/frederickmeyapiiii/facturation-pme:latest"

      - name: Restart Docker containers on EC2
        run: |
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} "cd /home/ubuntu/facturation-pme/docker && sudo docker compose -f docker-compose.prod.yml down && sudo docker compose -f docker-compose.prod.yml up -d"

      - name: Run migrations on EC2
        run: |
          ssh -i ~/.ssh/facturation-pme-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} "cd /home/ubuntu/facturation-pme/docker && sudo docker compose -f docker-compose.prod.yml exec web python manage.py migrate"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/facturation-pme-key.pem
