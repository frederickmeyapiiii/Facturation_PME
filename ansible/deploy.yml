---
- name: Deploy Facturation PME on Ubuntu
  hosts: web_servers
  become: yes
  vars_files:
    - vars/main.yml

  tasks:
    - name: Update package list
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - git
          - postgresql-client
          - nginx
          - curl
          - build-essential
          - libffi-dev
          - libpq-dev
        state: present

    - name: Create app user
      user:
        name: "{{ app_user }}"
        groups: "{{ app_group }}"
        home: "{{ app_dir }}"
        shell: /bin/bash
        system: yes
        create_home: yes

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'

    - name: Clone repository
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        update: yes
      become_user: "{{ app_user }}"

    - name: Create Python virtual environment
      command: python3 -m venv "{{ app_venv }}"
      become_user: "{{ app_user }}"
      args:
        creates: "{{ app_venv }}/bin/activate"

    - name: Upgrade pip in venv
      pip:
        name: pip
        state: latest
        virtualenv: "{{ app_venv }}"
      become_user: "{{ app_user }}"

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/src/requirements.txt"
        virtualenv: "{{ app_venv }}"
      become_user: "{{ app_user }}"

    - name: Create .env file
      template:
        src: django_env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'

    - name: Run Django migrations
      command: "{{ app_venv }}/bin/python {{ app_dir }}/src/manage.py migrate --noinput"
      environment:
        DJANGO_SETTINGS_MODULE: finance_manager.settings
      vars:
        django_env: "{{ lookup('template', 'django_env.j2') }}"
      become_user: "{{ app_user }}"

    - name: Collect static files
      command: "{{ app_venv }}/bin/python {{ app_dir }}/src/manage.py collectstatic --noinput"
      environment:
        DJANGO_SETTINGS_MODULE: finance_manager.settings
      become_user: "{{ app_user }}"

    - name: Create systemd service for Gunicorn
      template:
        src: gunicorn.service.j2
        dest: /etc/systemd/system/facturation_pme.service
        mode: '0644'
      register: gunicorn_service

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: gunicorn_service.changed

    - name: Enable and start Gunicorn service
      systemd:
        name: facturation_pme
        enabled: yes
        state: started

    - name: Configure Nginx reverse proxy
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/facturation_pme
        mode: '0644'
      register: nginx_config

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/facturation_pme
        dest: /etc/nginx/sites-enabled/facturation_pme
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    - name: Enable UFW firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Verify deployment
      uri:
        url: "http://127.0.0.1:{{ nginx_port }}/"
        method: GET
        status_code: 200
      register: deployment_check
      retries: 3
      delay: 5
      until: deployment_check.status == 200
