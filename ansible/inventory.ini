# Fichier d'inventaire Ansible pour Facturation PME
# Définit les hôtes cibles pour le déploiement

[webservers]
# Remplacer par les IPs réelles des instances Terraform
web-1 ansible_host=10.0.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/facturation-pme-key.pem
# web-2 ansible_host=10.0.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/facturation-pme-key.pem

[db_servers]
# Remplacer par l'IP réelle de l'instance RDS ou PostgreSQL
db-1 ansible_host=10.0.2.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/facturation-pme-key.pem

[monitoring_servers]
# Remplacer par l'IP réelle du serveur de monitoring
monitoring-1 ansible_host=10.0.1.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/facturation-pme-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
