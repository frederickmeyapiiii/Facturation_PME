version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturation_pme_web
    env_file:
      - .env.example
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16
    container_name: facturation_pme_db
    environment:
      POSTGRES_DB: facturation_pme
      POSTGRES_USER: facturation_pme_user
      POSTGRES_PASSWORD: change_me_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: facturation_pme_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  grafana:
    image: grafana/grafana:latest
    container_name: facturation_pme_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
