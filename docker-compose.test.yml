version: '3.9'

services:
  web:
    image: python:3.14-slim
    container_name: assistant_saas_test
    working_dir: /app
    volumes:
      - .:/app:delegated
      - test_db:/app/db.sqlite3
    ports:
      - "8001:8000"
    environment:
      DJANGO_SETTINGS_MODULE: finance_manager.settings
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: test
    command: |
      bash -lc "pip install --no-cache-dir -r requirements.txt && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

volumes:
  test_db:
    driver: local
