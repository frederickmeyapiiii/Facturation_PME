version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturation_pme_web
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16
    container_name: facturation_pme_db
    environment:
      POSTGRES_DB: facturation_pme
      POSTGRES_USER: facturation_pme_user
      POSTGRES_PASSWORD: change_me_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
