version: '3.8'

services:
  # Application Django en production
  web:
    image: ghcr.io/frederickmeyapiiii/facturation-pme:latest
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: facturation_pme_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=finance_manager.settings
      - DJANGO_DEBUG=False
      - DJANGO_DATABASE_HOST=db
      - DJANGO_DATABASE_PORT=5432
      - DJANGO_DATABASE_ENGINE=django.db.backends.postgresql
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/src/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "80:8000"

  # PostgreSQL isolé avec réseau privé
  db:
    image: postgres:15-alpine
    container_name: facturation_pme_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-facturationpme}
      - POSTGRES_USER=${DB_USER:-facturationpme}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-facturationpme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-facturationpme}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
