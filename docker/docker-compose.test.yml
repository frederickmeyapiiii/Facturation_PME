version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: facturation_pme_test
    env_file:
      - .env.example
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DJANGO_DATABASE_ENGINE: django.db.backends.postgresql
      DJANGO_DATABASE_NAME: finance_test_db
      DJANGO_DATABASE_USER: postgres
      DJANGO_DATABASE_PASSWORD: postgres
      DJANGO_DATABASE_HOST: db
      DJANGO_DATABASE_PORT: "5432"
    ports:
      - "8001:8000"
    depends_on:
      - db
    command: bash -lc "python manage.py migrate --noinput && python create_superuser.py && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16
    container_name: facturation_pme_test_db
    environment:
      POSTGRES_DB: finance_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - test_db:/var/lib/postgresql/data

volumes:
  test_db:
