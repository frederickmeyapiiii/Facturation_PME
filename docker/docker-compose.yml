version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: facturation_pme_web
    env_file:
      - .env.example
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    command: bash -lc "python manage.py migrate --noinput && python create_superuser.py && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16
    container_name: facturation_pme_db
    environment:
      POSTGRES_DB: facturation_pme
      POSTGRES_USER: facturation_pme_user
      POSTGRES_PASSWORD: change_me_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturation_pme_user -d facturation_pme"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
