<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Titre -->
  <text x="600" y="30" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">
    Architecture — Facturation PME
  </text>

  <!-- Légende des couleurs -->
  <rect x="50" y="50" width="20" height="20" fill="#4CAF50" />
  <text x="80" y="65" font-size="12" fill="#333">Utilisateurs</text>
  
  <rect x="250" y="50" width="20" height="20" fill="#2196F3" />
  <text x="280" y="65" font-size="12" fill="#333">Infrastructure</text>
  
  <rect x="500" y="50" width="20" height="20" fill="#FF9800" />
  <text x="530" y="65" font-size="12" fill="#333">Données</text>
  
  <rect x="750" y="50" width="20" height="20" fill="#9C27B0" />
  <text x="780" y="65" font-size="12" fill="#333">Monitoring</text>

  <!-- Niveau 1: Utilisateurs -->
  <circle cx="600" cy="150" r="40" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="600" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Utilisateurs</text>

  <!-- Flèche vers Nginx -->
  <path d="M 600 190 L 600 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="620" y="215" font-size="11" fill="#666">HTTP/HTTPS</text>

  <!-- Niveau 2: Reverse Proxy / Web Server -->
  <rect x="500" y="230" width="200" height="60" fill="#2196F3" stroke="#333" stroke-width="2" rx="5"/>
  <text x="600" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Nginx</text>
  <text x="600" y="275" font-size="11" text-anchor="middle" fill="white">Reverse Proxy</text>

  <!-- Flèche vers Django -->
  <path d="M 600 290 L 600 330" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Niveau 3: Application -->
  <rect x="420" y="330" width="360" height="100" fill="#2196F3" stroke="#333" stroke-width="2" rx="5"/>
  <text x="600" y="355" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Django Application</text>
  <text x="600" y="375" font-size="11" text-anchor="middle" fill="white">• Dashboard Facturation</text>
  <text x="600" y="395" font-size="11" text-anchor="middle" fill="white">• Export CSV/PDF</text>
  <text x="600" y="415" font-size="11" text-anchor="middle" fill="white">• Authentification</text>

  <!-- Flèches depuis Django -->
  <!-- Vers DB -->
  <path d="M 420 380 L 300 380 L 300 460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="370" font-size="11" fill="#666">Queries</text>

  <!-- Vers Prometheus -->
  <path d="M 780 380 L 900 380 L 900 460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="840" y="370" font-size="11" fill="#666">Metrics</text>

  <!-- Niveau 4: Base de données -->
  <rect x="200" y="460" width="200" height="70" fill="#FF9800" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="485" font-size="13" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
  <text x="300" y="505" font-size="11" text-anchor="middle" fill="white">Factures • Entreprise</text>
  <text x="300" y="520" font-size="11" text-anchor="middle" fill="white">Utilisateurs</text>

  <!-- Niveau 4: Monitoring -->
  <g>
    <!-- Prometheus -->
    <rect x="800" y="460" width="180" height="70" fill="#9C27B0" stroke="#333" stroke-width="2" rx="5"/>
    <text x="890" y="485" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Prometheus</text>
    <text x="890" y="505" font-size="10" text-anchor="middle" fill="white">Collecteur de</text>
    <text x="890" y="520" font-size="10" text-anchor="middle" fill="white">métriques</text>
  </g>

  <!-- Flèche Prometheus -> Grafana -->
  <path d="M 890 530 L 890 620" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Grafana -->
  <rect x="800" y="620" width="180" height="70" fill="#9C27B0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="890" y="645" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Grafana</text>
  <text x="890" y="665" font-size="10" text-anchor="middle" fill="white">Dashboard</text>
  <text x="890" y="680" font-size="10" text-anchor="middle" fill="white">visualisation</text>

  <!-- Backup Script -->
  <path d="M 300 530 L 300 600" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="570" font-size="11" fill="#666">Backup</text>

  <rect x="220" y="600" width="160" height="60" fill="#FF9800" stroke="#333" stroke-width="2" rx="5"/>
  <text x="300" y="625" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Backup Storage</text>
  <text x="300" y="645" font-size="10" text-anchor="middle" fill="white">Archives SQL</text>

  <!-- Flèche Grafana vers Utilisateurs (boucle monitoring) -->
  <path d="M 890 690 L 890 750 L 100 750 L 100 180 L 560 180" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="50" y="470" font-size="11" fill="#9C27B0">Dashboards</text>

  <!-- Flèche Docker Compose -->
  <rect x="50" y="700" width="200" height="60" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="150" y="720" font-size="11" font-weight="bold" text-anchor="middle" fill="#666">Environnement</text>
  <text x="150" y="738" font-size="10" text-anchor="middle" fill="#666">docker-compose.yml</text>

  <!-- Flèche Ansible -->
  <rect x="950" y="700" width="200" height="60" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="1050" y="720" font-size="11" font-weight="bold" text-anchor="middle" fill="#666">Déploiement</text>
  <text x="1050" y="738" font-size="10" text-anchor="middle" fill="#666">ansible/deploy.yml</text>

  <!-- Définition des flèches -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333" />
    </marker>
  </defs>
</svg>
