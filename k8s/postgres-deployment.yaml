apiVersion: apps/v1
kind: Deployment
metadata:
  name: facturation-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facturation-db
  template:
    metadata:
      labels:
        app: facturation-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: facturation_pme
        - name: POSTGRES_USER
          value: facturation_pme_user
        - name: POSTGRES_PASSWORD
          value: change_me_password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc