global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgresql"
    static_configs:
      - targets: ["db:5432"]
        labels:
          instance: "facturation_pme_db"

  - job_name: "django_app"
    static_configs:
      - targets: ["web:8000"]
        labels:
          instance: "facturation_pme_web"
