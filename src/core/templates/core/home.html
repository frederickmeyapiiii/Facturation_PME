<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAYOMI - Gestion des Facturations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .left {
            flex: 1;
            padding: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            position: relative;
            overflow: hidden;
        }
        .right::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            top: -50px;
            right: -50px;
        }
        .right::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            bottom: -30px;
            left: -30px;
        }
        .right img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            z-index: 1;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        h1 {
            color: #1a1a2e;
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.3;
        }
        p {
            color: #555;
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.8;
        }
        .features {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #444;
            font-size: 0.9rem;
        }
        .feature-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            width: fit-content;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .right {
                min-height: 250px;
            }
            .left {
                padding: 40px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logo">NAYOMI</div>
            <h1>Système de Gestion des Facturations</h1>
            <p>
                Simplifiez votre gestion financière. Créez des factures professionnelles, suivez vos paiements et gérez vos clients avec une interface intuitive et puissante.
            </p>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    Facturation rapide
                </div>
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    Export PDF
                </div>
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    Suivi des paiements
                </div>
            </div>
            <a href="/" class="btn">Accédez à votre espace →</a>
        </div>
        <div class="right">
            <img src="https://www.qualit-enr.org/wp-content/uploads/2020/12/Facture2.png" alt="Facturation">
        </div>
    </div>
</body>
</html>
